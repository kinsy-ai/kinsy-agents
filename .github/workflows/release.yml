# Publishes the CLI to npm when a tag `cli-v<version>` is pushed. Uses npm
# trusted publishing (OIDC): no token in the repository. One-time setup on
# npmjs.com: package `kinsy` → Settings → Trusted publishing → GitHub
# Actions, repository kinsy-ai/kinsy-agents, workflow release.yml.
name: Publish CLI

on:
  push:
    tags: ["cli-v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted publishing (OIDC) needs a current npm: the registry's token
      # exchange moved on after 11.5.1 and that pin failed with E404 on PUT
      # (7 Nov 2026). Pinned to the major so the job never runs a surprise npm.
      - run: npm install -g npm@12
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tag matches package.json
        run: test "cli-v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm publish --provenance --access public
